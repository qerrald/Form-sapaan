<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Sapa Menggunakan AJAX dan PHP</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f3f3;
            font-family: Arial, Helvetica, sans-serif;
            color: #292929;
        }

        .container {
            width: 100%;
            max-width: 650px;
            padding: 48px 42px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.09);
        }

        h1 {
            margin: 0 0 34px;
            text-align: center;
            font-size: 30px;
            line-height: 1.3;
        }

        label {
            display: block;
            margin: 0 0 10px;
            font-size: 16px;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d8d8;
            border-radius: 7px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #087bfa;
            box-shadow: 0 0 0 3px rgba(8, 123, 250, 0.12);
        }

        button {
            display: block;
            margin: 20px auto 24px;
            padding: 13px 30px;
            border: 0;
            border-radius: 7px;
            background: #087bfa;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #0068d9; }
        button:disabled { opacity: 0.65; cursor: wait; }

        h2 {
            margin: 0 0 30px;
            text-align: center;
            font-size: 24px;
        }

        #response {
            min-height: 60px;
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #dedede;
            border-radius: 8px;
            background: #f8f8f8;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        #response.success {
            color: #16803b;
            background: #e5ffec;
            border-color: #75d58a;
        }

        #response.error {
            color: #d92323;
            background: #ffe7e7;
            border-color: #ff7777;
        }

        @media (max-width: 520px) {
            .container { padding: 32px 22px; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Form Sapa Menggunakan AJAX dan PHP</h1>

        <form id="sapaForm">
            <label for="nama">Masukkan Nama Anda:</label>
            <input
                type="text"
                id="nama"
                name="nama"
                placeholder="Contoh: Alex"
                autocomplete="name"
            >
            <button type="submit" id="kirimButton">Kirim</button>
        </form>

        <h2>Respon Server:</h2>
        <div id="response" aria-live="polite">Menunggu input...</div>
    </main>

    <script>
        const form = document.getElementById("sapaForm");
        const responseArea = document.getElementById("response");
        const kirimButton = document.getElementById("kirimButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const nama = document.getElementById("nama").value;
            const formData = new URLSearchParams();
            formData.append("nama", nama);

            kirimButton.disabled = true;
            responseArea.className = "";
            responseArea.textContent = "Memproses...";

            try {
                const result = await fetch("server.php", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                const message = await result.text();
                responseArea.textContent = message;

                if (result.ok && message.startsWith("Halo,")) {
                    responseArea.className = "success";
                } else {
                    responseArea.className = "error";
                }
            } catch (error) {
                responseArea.textContent =
                    "Tidak dapat terhubung ke server. Pastikan Herd sedang berjalan.";
                responseArea.className = "error";
            } finally {
                kirimButton.disabled = false;
            }
        });
    </script>
</body>
</html>
